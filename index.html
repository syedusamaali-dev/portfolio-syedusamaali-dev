<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Usama Ali | Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- SINGLE GLOBAL HEADER -->
  <header class="profile-header">
    <div class="profile-info">
      <div class="avatar-container">
        <img src="assests/profile-pic.png" alt="Usama Ali Profile">
      </div>
      <div>
        <h1>Usama Ali</h1>
        <p>Full-Stack Engineer &bull; MEAN & MERN Architecture</p>
      </div>
    </div>

    <nav class="header-nav">
      <button class="nav-btn" onclick="openModal('about')">👤 About Me</button>
      <button class="nav-btn" onclick="openModal('contact')">📩 Contact</button>
      <a href="https://github.com/syedusamaali-dev" target="_blank" class="nav-btn">🐙 GitHub</a>
      <a href="https://www.linkedin.com/in/syedusamaali-dev/" target="_blank" class="nav-btn">💼 LinkedIn</a>
    </nav>
  </header>

  <div class="snap-container">
    <section class="slide">
      <!-- 8-Card Grid Container -->
      <div class="projects-grid" id="projectsGrid">
        <!-- Rendered dynamically via JavaScript -->
      </div>
    </section>
  </div>

  <!-- Unified Popup Modal Base -->
  <div class="modal-overlay" id="infoModal">
    <div class="modal-content" id="modalContainer">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modalBody" style="height: 100%;"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
